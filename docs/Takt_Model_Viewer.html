<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Takt BIM Model Viewer</title>
<style>
:root { color-scheme: light; font-family: Inter, Segoe UI, Arial, sans-serif; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #eef2f7; color: #111827; overflow: hidden; }
.app { display: grid; grid-template-columns: 320px 1fr; height: 100vh; height: 100dvh; }
aside { background: #ffffff; border-right: 1px solid #dbe3ee; padding: 16px; overflow: auto; -webkit-overflow-scrolling: touch; }
main { position: relative; min-width: 0; min-height: 0; }
h1 { margin: 0 0 12px; font-size: 20px; letter-spacing: 0; }
h2 { margin: 18px 0 8px; font-size: 13px; color: #334155; text-transform: uppercase; letter-spacing: 0; }
label { display: block; font-size: 12px; color: #475569; margin-bottom: 6px; }
select, button { width: 100%; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 4px; background: white; color: #111827; padding: 8px 10px; min-height: 38px; font-size: 13px; }
button { cursor: pointer; margin-top: 8px; }
button:hover { background: #f8fafc; }
.row { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 13px; color: #334155; }
.row input { width: 16px; height: 16px; }
#viewer { width: 100%; height: 100%; display: block; background: #dbe5ef; }
.status { position: absolute; left: 16px; top: 16px; background: rgba(15, 23, 42, 0.88); color: white; padding: 8px 10px; border-radius: 4px; font-size: 12px; max-width: min(520px, calc(100% - 32px)); }
.swatch-list { display: grid; gap: 6px; margin-top: 8px; }
.swatch { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12px; color: #334155; text-align: left; }
.swatch i { width: 14px; height: 14px; border-radius: 2px; display: block; }
.swatch span { min-width: 0; overflow-wrap: anywhere; }
.info { font-size: 13px; line-height: 1.45; color: #334155; }
.info strong { display: block; color: #0f172a; margin: 8px 0 2px; }
.schedule-row { border-bottom: 1px solid #e5e7eb; padding: 6px 0; font-size: 12px; }
.schedule-row span { display: block; color: #64748b; }
.empty { color: #64748b; font-size: 13px; }
canvas { outline: none; }
@media (max-width: 760px) {
  body { overflow: auto; }
  .app { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; height: auto; }
  aside { order: 1; border-right: 0; border-bottom: 1px solid #dbe3ee; padding: 14px 16px; max-height: 46vh; overflow: auto; }
  main { order: 2; height: 54vh; min-height: 380px; }
  h1 { font-size: 19px; margin-bottom: 10px; }
  h2 { margin-top: 14px; }
  #viewer { height: 100%; touch-action: none; }
  .status { left: 10px; right: 10px; top: 10px; max-width: none; font-size: 11px; }
  .swatch-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 460px) {
  aside { max-height: 50vh; }
  main { height: 50vh; min-height: 320px; }
  .swatch-list { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Takt BIM Viewer</h1>
    <label for="zoneFilter">Takt Zone</label>
    <select id="zoneFilter">
      <option value="all">All zones</option>
      <option value="L 1 Takt Zone 1">L 1 Takt Zone 1 (168, 169)</option>
<option value="L 1 Takt Zone 2">L 1 Takt Zone 2 (170, 171)</option>
<option value="L 1 Takt Zone 3">L 1 Takt Zone 3 (172, 173)</option>
<option value="L 1 Takt Zone 4">L 1 Takt Zone 4 (174, 175)</option>
<option value="L 1 Takt Zone 5">L 1 Takt Zone 5 (176, 177)</option>
<option value="L 1 Takt Zone 6">L 1 Takt Zone 6 (178, 180)</option>
<option value="L 1 Takt Zone 7">L 1 Takt Zone 7 (179, 202)</option>
<option value="L 1 Takt Zone 9">L 1 Takt Zone 9 (146, 162)</option>
<option value="L 1 Takt Zone 10">L 1 Takt Zone 10 (142, 143)</option>
<option value="L 1 Takt Zone 11">L 1 Takt Zone 11 (145, 210)</option>
<option value="L 1 Takt Zone 12">L 1 Takt Zone 12 (211, 163)</option>
<option value="L 1 Takt Zone 13">L 1 Takt Zone 13 (199, 154)</option>
<option value="L 1 Takt Zone 14">L 1 Takt Zone 14 (206, 155)</option>
<option value="L 1 Takt Zone 15">L 1 Takt Zone 15 (159, 158)</option>
<option value="L 1 Takt Zone 16">L 1 Takt Zone 16 (157, 156)</option>
<option value="L 1 Takt Zone 8">L 1 Takt Zone 8 (201, 150)</option>
    </select>
    <button id="resetView" type="button">Reset View</button>
    <label class="row"><input id="isolateZone" type="checkbox" checked> Isolate selected zone</label>

    <h2>Zones</h2>
    <div id="zoneLegend" class="swatch-list"></div>

    <h2>Selected</h2>
    <div id="selectedInfo" class="info empty">Click an element in the model.</div>

    <h2>Zone Schedule</h2>
    <div id="zoneSchedule" class="info empty">Select a takt zone.</div>
  </aside>
  <main>
    <canvas id="viewer"></canvas>
    <div id="status" class="status">Loading model...</div>
  </main>
</div>

    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

  }
}
</script>

const VALID_ELEMENT_IDS = new Set(Object.keys(DATA.element_by_id));
const VALID_ELEMENT_IDS_BY_LENGTH = [...VALID_ELEMENT_IDS].sort((a, b) => b.length - a.length);
const ZONE_PALETTE = [
  '#2563eb', '#16a34a', '#dc2626', '#9333ea', '#ea580c',
  '#0891b2', '#be123c', '#4f46e5', '#65a30d', '#ca8a04',

];
const ORDER_GRADIENT = ['#2563eb', '#0891b2', '#059669', '#ca8a04', '#dc2626'];

function extractElementId(object) {
  const candidates = [];
  let current = object;
  while (current) {
    candidates.push(current.name);
    candidates.push(current.geometry && current.geometry.name);
    candidates.push(current.material && current.material.name);
    if (current.userData) {
      for (const value of Object.values(current.userData)) candidates.push(value);
    }
    current = current.parent;
  }
  for (const candidate of candidates) {
    const text = String(candidate || '');
    const directMatch = text.match(/\[(\d{4,})\]/);
    if (directMatch && VALID_ELEMENT_IDS.has(directMatch[1])) return directMatch[1];

    const encodedMatch = text.match(/(?:_u005[Bb]|%5[Bb]|\()\s*(\d{4,})\s*(?:_u005[Dd]|%5[Dd]|\))/);
    if (encodedMatch && VALID_ELEMENT_IDS.has(encodedMatch[1])) return encodedMatch[1];

    const tailMatch = text.match(/(?:^|[^0-9])(\d{6,})(?:[^0-9]|$)/g);
    if (tailMatch) {
      for (const token of tailMatch) {
        const id = token.replace(/\D/g, '');
        if (VALID_ELEMENT_IDS.has(id)) return id;
      }
    }
  }
  const joined = candidates.map(value => String(value || '')).join(' ');
  for (const id of VALID_ELEMENT_IDS_BY_LENGTH) {
    if (joined.includes(id)) return id;
  }
  return '';
}

function colorForZone(zoneId) {
  return DATA.zone_colors[zoneId] || '#94a3b8';
}

function materialFor(color, opacity = 1) {
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color(color),
    roughness: 0.72,
    metalness: 0.05,
    transparent: opacity < 1,
    opacity,
    depthWrite: opacity >= 1,
  });
}

function interpolateHexColor(startHex, endHex, t) {
  const start = new THREE.Color(startHex);
  const end = new THREE.Color(endHex);
  return `#${start.lerp(end, t).getHexString()}`;
}

function gradientColorForIndex(index, total) {
  if (total <= 1) return ORDER_GRADIENT[0];
  const scaled = (index / (total - 1)) * (ORDER_GRADIENT.length - 1);
  const lower = Math.floor(scaled);
  const upper = Math.min(ORDER_GRADIENT.length - 1, lower + 1);
  return interpolateHexColor(ORDER_GRADIENT[lower], ORDER_GRADIENT[upper], scaled - lower);
}

function firstZoneForElement(elementId) {
  const record = DATA.element_by_id[elementId];
  return record && record.zones && record.zones.length ? record.zones[0] : '';
}

function roomNumberFromLabel(label) {
  const match = String(label || '').match(/Room\s+([0-9A-Za-z.-]+)/i);
  return match ? match[1] : '';
}

function applyCandidateZones(candidate) {
  if (!candidate || !Array.isArray(candidate.lanes)) {
    return;
  }

  const roomToZone = new Map();
  const totalZones = candidate.lanes.length;
  DATA.zones = candidate.lanes.map((lane, index) => {
    const zoneId = `L 1 Takt Zone ${lane.zoneId}`;
    const roomLabels = String(lane.rooms || '')
      .split(',')
      .map(room => room.trim())
      .filter(Boolean);
    for (const room of roomLabels) {
      roomToZone.set(room, zoneId);
    }
    return {
      id: zoneId,
      label: `${zoneId}${roomLabels.length ? ` (${roomLabels.join(', ')})` : ''}`,
      sequence: index + 1,
      color: gradientColorForIndex(index, totalZones),
      lane,
    };
  });
  DATA.zone_colors = Object.fromEntries(DATA.zones.map(zone => [zone.id, zone.color]));
  DATA.zone_summaries = Object.fromEntries(DATA.zones.map(zone => {
    const lane = zone.lane || {};
    return [zone.id, {
      element_count: 0,
      task_counts: {},
      schedule: (lane.bars || []).map(bar => ({
        task: bar.trade,
        crew: bar.trade,
        start_hour: Number(bar.start).toFixed(2),
        finish_hour: Number(bar.start + bar.duration).toFixed(2),
        duration_hours: Number(bar.duration).toFixed(2),
        quantity: Number(bar.quantity).toFixed(1),
        quantity_unit: '',
      })),
    }];
  }));

  for (const record of Object.values(DATA.element_by_id)) {
    const zoneIds = new Set();
    for (const roomLabel of record.rooms || []) {
      const roomNumber = roomNumberFromLabel(roomLabel);
      if (roomToZone.has(roomNumber)) zoneIds.add(roomToZone.get(roomNumber));
    }
    record.zones = [...zoneIds];
    for (const zoneId of record.zones) {
      const summary = DATA.zone_summaries[zoneId];
      if (!summary) continue;
      summary.element_count += 1;
      for (const task of record.tasks || []) {
        summary.task_counts[task] = (summary.task_counts[task] || 0) + 1;
      }
    }
  }

  zoneFilter.innerHTML = '<option value="all">All zones</option>' + DATA.zones
    .map(zone => `<option value="${zone.id}">${zone.label}</option>`)
    .join('');
  selectedInfo.className = 'info empty';
  selectedInfo.textContent = `Viewing final generation point ${candidate.rank}. Click an element in the model.`;
  statusEl.textContent = `Viewing final generation point ${candidate.rank}: ${candidate.lanes.length} takt zones`;
  renderLegend();
  applyZoneFilter();
}

function selectedZoneId() {
  return zoneFilter.value === 'all' ? '' : zoneFilter.value;
}

function applyZoneFilter() {
  const zoneId = selectedZoneId();
  for (const mesh of selectable) {
    const elementId = mesh.userData.elementId;
    const record = DATA.element_by_id[elementId];
    const zones = record ? record.zones || [] : [];
    const inZone = !zoneId || zones.includes(zoneId);
    mesh.visible = !zoneId || inZone || !isolateZone.checked;
    const color = inZone ? colorForZone(zones[0]) : '#cbd5e1';
    const opacity = inZone ? 0.92 : 0.16;
    mesh.material = materialFor(color, opacity);
  }
  renderZoneSchedule(zoneId);
}

function renderZoneSchedule(zoneId) {
  if (!zoneId) {
    zoneSchedule.className = 'info empty';
    zoneSchedule.textContent = 'Select a takt zone.';
    return;
  }
  const summary = DATA.zone_summaries[zoneId] || {};
  const rows = summary.schedule || [];
  const counts = summary.task_counts || {};
  zoneSchedule.className = 'info';
  zoneSchedule.innerHTML = `
    <strong>${zoneId}</strong>
    <div>${summary.element_count || 0} linked FBX/BIM elements</div>
    <div>${Object.entries(counts).map(([task, count]) => `${task}: ${count}`).join('<br>')}</div>
    <strong>Tasks</strong>
    ${rows.map(row => `<div class="schedule-row">${row.task}<span>${row.start_hour}h to ${row.finish_hour}h · ${row.quantity} ${row.quantity_unit}</span></div>`).join('') || '<div class="empty">No schedule rows.</div>'}
  `;
}

function renderLegend() {
  zoneLegend.innerHTML = DATA.zones.map(zone => {
    const summary = DATA.zone_summaries[zone.id] || {};
    return `<button class="swatch" type="button" data-zone="${zone.id}">
      <i style="background:${zone.color}"></i>
      <span>${zone.label}</span>
      <em>${summary.element_count || 0}</em>
    </button>`;
  }).join('');
  zoneLegend.querySelectorAll('button[data-zone]').forEach(button => {
    button.addEventListener('click', () => {
      zoneFilter.value = button.dataset.zone;
      applyZoneFilter();
    });
  });
}

function showElementInfo(mesh) {
  const elementId = mesh.userData.elementId || extractElementId(mesh);
  const record = DATA.element_by_id[elementId];
  selectedObject = mesh;
  if (!record) {
    selectedInfo.className = 'info';
    selectedInfo.innerHTML = `<strong>${mesh.name || 'FBX object'}</strong><div>ElementId: ${elementId || 'not found'}</div><div>No takt allocation match.</div>`;
    return;
  }
  selectedInfo.className = 'info';
  selectedInfo.innerHTML = `
    <strong>${mesh.name || 'FBX object'}</strong>
    <div>ElementId: ${elementId}</div>
    <div>Zone: ${record.zones.join(', ')}</div>
    <div>Task: ${record.tasks.join(', ')}</div>
    <div>Room: ${record.rooms.join(', ') || 'n/a'}</div>
    <div>Category: ${record.categories.join(', ') || 'n/a'}</div>
  `;
}

function fitCameraToObject(object) {
  const box = new THREE.Box3().setFromObject(object);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const distance = maxDim / (2 * Math.tan((Math.PI * camera.fov) / 360));
  camera.position.set(center.x + distance * 0.72, center.y + distance * 0.64, center.z + distance * 0.72);
  camera.near = Math.max(distance / 1000, 0.1);
  camera.far = distance * 12;
  camera.updateProjectionMatrix();
  controls.target.copy(center);
  controls.update();
}

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  renderer.setSize(rect.width, rect.height, false);
  camera.aspect = rect.width / Math.max(rect.height, 1);
  camera.updateProjectionMatrix();
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

canvas.addEventListener('pointerdown', event => {
  const rect = canvas.getBoundingClientRect();
  pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(selectable.filter(mesh => mesh.visible), false)[0];
  if (hit) showElementInfo(hit.object);
});

zoneFilter.addEventListener('change', applyZoneFilter);
isolateZone.addEventListener('change', applyZoneFilter);
document.getElementById('resetView').addEventListener('click', () => {
  if (model) fitCameraToObject(model);
});
window.addEventListener('resize', resize);
window.addEventListener('message', event => {
  if (!event.data || event.data.type !== 'takt-candidate-selected') {
    return;
  }
  applyCandidateZones(event.data.candidate);
});

renderLegend();
resize();
animate();

new FBXLoader().load(
  MODEL_SRC,
  object => {
    model = object;
    scene.add(model);
    let matched = 0;
    let total = 0;
    const unmatchedNames = [];
    object.traverse(child => {
      if (!child.isMesh) return;
      total += 1;
      const elementId = extractElementId(child);
      child.userData.elementId = elementId;
      child.castShadow = true;
      child.receiveShadow = true;
      if (elementId && DATA.element_by_id[elementId]) matched += 1;
      else if (unmatchedNames.length < 4) unmatchedNames.push(child.name || (child.parent && child.parent.name) || 'unnamed mesh');
      const zoneId = firstZoneForElement(elementId);
      child.material = materialFor(zoneId ? colorForZone(zoneId) : '#cbd5e1', zoneId ? 0.9 : 0.22);
      selectable.push(child);
    });
    fitCameraToObject(model);
    statusEl.textContent = `Loaded ${total} meshes · ${matched} matched to takt BIM data` + (unmatchedNames.length ? ` · sample unmatched: ${unmatchedNames.join(' | ')}` : '');
    applyZoneFilter();
  },
  event => {
    if (event.total) statusEl.textContent = `Loading model... ${Math.round((event.loaded / event.total) * 100)}%`;
  },
  error => {
    console.error(error);
    statusEl.textContent = 'Could not load FBX. Open this page through a local web server, not directly as a file.';
  }
);
</script>
</body>
</html>
